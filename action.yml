name: "Get Timestamp Action"
description: "Get the time in the specified time zone"
author: "boredland"
branding:
  icon: arrow-right-circle
  color: gray-dark
inputs:
  timeZone:
    description: "linux time zone"
    required: false
    default: "UTC"
  format:
    description: "timestamp format"
    required: false
    default: "YYYY-MM-DD HH:mm:ss"
outputs:
  time:
    description: "current time"
    value: ${{ steps.time.outputs.value }}
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - id: time
      shell: bash
      env:
        TZ: ${{ inputs.timeZone }}
        INPUT_FORMAT: ${{ inputs.format }}
      run: |
        TEMPLATE="$INPUT_FORMAT"
        TEMPLATE=${TEMPLATE/YYYY/%Y}
        TEMPLATE=${TEMPLATE/MM/%m}
        TEMPLATE=${TEMPLATE/DD/%d}
        TEMPLATE=${TEMPLATE/HH/%H}
        TEMPLATE=${TEMPLATE/mm/%M}
        TEMPLATE=${TEMPLATE/ss/%S}
        DATE=$(date +"$TEMPLATE")
        safe=$(printf '%s' "$DATE" | tr -d '\n\r')
        echo "value=$safe" >> "$GITHUB_OUTPUT"
