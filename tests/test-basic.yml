name: Test basic usage (defaults)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert time output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.time }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty time output"
            exit 1
          fi
          echo "PASS: got time '$ACTUAL'"
      - name: Assert time output matches default format YYYY-MM-DD HH:mm:ss
        env:
          ACTUAL: ${{ steps.action.outputs.time }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$'; then
            echo "FAIL: time '$ACTUAL' does not match expected format YYYY-MM-DD HH:mm:ss"
            exit 1
          fi
          echo "PASS: time matches expected format"
