name: Test custom format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          timeZone: 0
          format: YYYY-MM-DD
      - name: Assert time output matches YYYY-MM-DD pattern
        env:
          ACTUAL: ${{ steps.action.outputs.time }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty time output"
            exit 1
          fi
          # Verify the output matches YYYY-MM-DD format (10 chars, digits and dashes)
          if echo "$ACTUAL" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "PASS: output matches YYYY-MM-DD format"
          else
            echo "FAIL: output '$ACTUAL' does not match YYYY-MM-DD format"
            exit 1
          fi
