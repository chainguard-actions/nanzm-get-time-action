name: Test custom timezone
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          timeZone: 8
      - name: Assert time output is non-empty with timezone offset
        env:
          ACTUAL: ${{ steps.action.outputs.time }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty time output for timezone +8"
            exit 1
          fi
          echo "PASS: got time '$ACTUAL'"
